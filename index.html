<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Aev Battle — 3D Arena Brawler</title>
<style>
:root{color-scheme:dark;--cyan:#54e6ff;--panel:rgba(5,14,28,.82)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091523;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:14px;left:14px;font-weight:900;font-size:clamp(17px,3vw,26px);letter-spacing:2px;text-shadow:0 2px 12px #000}.brand span{color:var(--cyan)}.panel{background:var(--panel);border:1px solid #ffffff26;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}#stats{position:absolute;top:60px;left:14px;display:grid;gap:7px;min-width:150px;font-size:13px}.bar{height:8px;background:#263747;border-radius:8px;overflow:hidden;margin-top:4px}.fill{height:100%;width:100%;transition:width .15s}.health{background:#42e58a}.shield{background:#4bc8ff}#rightstats{position:absolute;right:14px;top:14px;text-align:right;font-size:13px}#message{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,5vw,42px);font-weight:900;text-align:center;text-shadow:0 3px 16px #000;max-width:90%;white-space:pre-line}#hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;color:#d4e8f3;text-shadow:0 2px 8px #000;white-space:nowrap}#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07111dcc,#07111d9c);z-index:5;padding:20px}#start .card{max-width:440px;width:100%;text-align:center;padding:26px;background:#0b1a2bed;border:1px solid #54e6ff70;border-radius:20px;box-shadow:0 20px 70px #0008}h1{font-size:clamp(32px,8vw,52px);margin:0;letter-spacing:3px}h1 span{color:var(--cyan)}.sub{color:#b8cbd9;margin:8px 0 18px}.features{font-size:13px;color:#d6e8f2;line-height:1.8;margin:16px 0}.btn{border:0;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:800;color:#06121d;background:linear-gradient(100deg,#54e6ff,#62ffa8);width:100%;cursor:pointer}.small{font-size:11px;color:#90a9bb;margin-top:12px;line-height:1.5}#mobile{position:fixed;inset:0;pointer-events:none;display:none}.stick{position:absolute;bottom:32px;left:26px;width:118px;height:118px;border-radius:50%;background:#b7eaff20;border:2px solid #d9f7ff66;pointer-events:auto;touch-action:none}.nub{position:absolute;width:46px;height:46px;left:34px;top:34px;border-radius:50%;background:#7beaff99;border:2px solid #e5fcff}.action{position:absolute;right:24px;bottom:35px;width:74px;height:74px;border-radius:50%;background:#ff714a9c;border:2px solid #ffd4c5;color:#fff;font-weight:900;pointer-events:auto;touch-action:none}.jump{position:absolute;right:35px;bottom:122px;width:52px;height:52px;border-radius:50%;background:#67d7ff80;border:1px solid #d6f8ff;color:#fff;pointer-events:auto}#crosshair{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.85}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#e9ffff;box-shadow:0 0 5px #000}#crosshair:before{width:2px;height:18px;left:8px}#crosshair:after{height:2px;width:18px;top:8px}@media(pointer:coarse){#mobile{display:block}#hint{bottom:9px;font-size:10px}}@media(min-width:700px){#stats{top:70px}}
</style>
</head>
<body>
<div id="hud">
 <div class="brand">AEV <span>BATTLE</span></div>
 <div id="stats" class="panel">
  <div>体力 <b id="hptext">100</b><div class="bar"><div id="hp" class="fill health"></div></div></div>
  <div>シールド <b id="shtext">50</b><div class="bar"><div id="sh" class="fill shield"></div></div></div>
  <div>撃破 <b id="kills">0</b></div>
 </div>
 <div id="rightstats" class="panel">💎 ジェム <b id="gems">0</b> / 10<br><span id="zone">ジェムを集めよう</span></div>
 <div id="message"></div>
 <div id="hint">WASD / 矢印キー：移動　マウス：視点　クリック：射撃　Shift：ダッシュ</div>
</div>
<div id="crosshair"></div>
<div id="mobile"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><button class="action" id="fire">FIRE</button><button class="jump" id="sprint">RUN</button></div>
<div id="start"><div class="card"><h1>AEV <span>BATTLE</span></h1><div class="sub">3D ARENA BRAWLER · PROTOTYPE</div><div class="features">💎 アリーナでジェムを集める<br>🎯 敵を狙ってショット<br>🛡️ 体力・シールドと障害物<br>📱 スマホ・PC対応</div><button class="btn" id="play">戦闘開始</button><div class="small">試作版：ブロスタ風の見下ろし型アリーナ戦です（公式素材は不使用）。オンライン対戦ではありません。<br>PC：WASD移動・マウスで狙う・クリック射撃／スマホ：左スティック移動・右側ドラッグで狙う・FIRE</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd5ed);scene.fog=new THREE.Fog(0x8bd5ed,42,125);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8f5ff,0x375039,2.0));const sun=new THREE.DirectionalLight(0xfff2d1,2.4);sun.position.set(-25,38,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x4b9b59),sandMat=mat(0xd9c58a),rockMat=mat(0x71828b),woodMat=mat(0x80502d),leafMat=mat(0x217b52),leaf2=mat(0x39945b),buildingMat=mat(0x607b91),roofMat=mat(0x293c51),whiteMat=mat(0xe8f4f8);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(58,62,3,64),groundMat);ground.position.y=-1.5;ground.receiveShadow=true;scene.add(ground);
const beach=new THREE.Mesh(new THREE.CylinderGeometry(60,64,1.1,64),sandMat);beach.position.y=-.9;scene.add(beach);
const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x2589bb,roughness:.35,metalness:.1}));water.rotation.x=-Math.PI/2;water.position.y=-2.2;scene.add(water);
const obstacles=[];function box(x,y,z,sx,sy,sz,material,collide=true){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);if(collide)obstacles.push({x,z,rx:sx/2+.65,rz:sz/2+.65,top:sy});return o}
function tree(x,z,scale=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*scale,.34*scale,2.2*scale,7),woodMat);trunk.position.set(x,1.1*scale,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((1.25-i*.18)*scale,2.1*scale,7),i%2?leaf2:leafMat);crown.position.set(x,(2.3+i*.62)*scale,z);crown.castShadow=true;scene.add(crown)}}
function rock(x,z,s=1){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rockMat);r.position.set(x,s*.45,z);r.scale.y=.7;r.castShadow=true;scene.add(r)}
// landmarks and cover
for(let i=0;i<44;i++){const a=i*2.399,r=17+(i%7)*5,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z)>48)continue;tree(x,z,.7+(i%4)*.12)}
for(let i=0;i<13;i++){const a=i*2.4,r=9+(i%4)*7;rock(Math.cos(a)*r,Math.sin(a)*r,.7+(i%3)*.35)}
// small village
for(const [x,z,w,d] of [[-10,-7,5,5],[-2,-10,4,5],[8,-5,5,4],[11,5,4,5],[-8,8,5,4]]){box(x,1.7,z,w,3.4,d,buildingMat);const roof=box(x,3.7,z,w+0.5,.5,d+0.5,roofMat,false);box(x,1,z+d/2+.04,w*.22,2,.12,woodMat,false);for(let j=-1;j<=1;j+=2)box(x+j*w*.25,2,z-d/2-.07,.8,.7,.12,whiteMat,false)}
// simple paths
for(let i=0;i<10;i++){const a=i*Math.PI/5;const p=new THREE.Mesh(new THREE.BoxGeometry(2.3,.06,8),sandMat);p.position.set(Math.cos(a)*17,-.42,Math.sin(a)*17);p.rotation.y=-a;p.receiveShadow=true;scene.add(p)}
const player={pos:new THREE.Vector3(0,0,20),yaw:Math.PI,health:100,shield:50,kills:0,gems:0,alive:true};const playerRoot=new THREE.Group();scene.add(playerRoot);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,4,8),mat(0x14a6b9));body.position.y=1.25;body.castShadow=true;playerRoot.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),mat(0xf2c6a0));head.position.y=2.08;playerRoot.add(head);const backpack=new THREE.Mesh(new THREE.BoxGeometry(.55,.65,.24),mat(0x183c50));backpack.position.set(0,1.3,.48);playerRoot.add(backpack);
const enemies=[];const enemyColors=[0xe85d5d,0xe8a43c,0xb16be8,0x5c7fe8,0xd95b9b,0x6cb56b,0xd2d9e2,0xb77745,0x48bfc0];
function makeEnemy(i){const g=new THREE.Group(),color=enemyColors[i%enemyColors.length];const b=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.78,4,7),mat(color));b.position.y=1.15;b.castShadow=true;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.29,10,8),mat(0xe8c2a0));h.position.y=1.95;g.add(h);g.position.set(Math.cos(i*2.4)* (10+i%3*4),0,Math.sin(i*2.4)*(10+i%3*4));scene.add(g);enemies.push({g,hp:100,alive:true,shot:1+i*.2,dir:new THREE.Vector3(),id:i})}
for(let i=0;i<9;i++)makeEnemy(i);
const ringMat=new THREE.MeshBasicMaterial({color:0x44eaff,transparent:true,opacity:.82});const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.12,8,96),ringMat);ring.rotation.x=Math.PI/2;ring.position.y=.15;scene.add(ring);\nconst gems=[];const gemGeo=new THREE.OctahedronGeometry(.48,0);const gemMat=new THREE.MeshStandardMaterial({color:0x53eaff,emissive:0x087bba,emissiveIntensity:1.4,metalness:.25,roughness:.25});function spawnGem(x,z){const m=new THREE.Mesh(gemGeo,gemMat);m.position.set(x,.8,z);m.castShadow=true;scene.add(m);gems.push(m)}for(let i=0;i<10;i++){const a=i*2.4,r=5+(i%4)*5;spawnGem(Math.cos(a)*r,Math.sin(a)*r)}
const keys={};let started=false,ended=false,fireHeld=false,sprinting=false,elapsed=0,zoneRadius=52,zoneTimer=0,mouseLocked=false;let joy={x:0,y:0};let yaw=0,pitch=-.16;const raycaster=new THREE.Raycaster();const center=new THREE.Vector2(0,0);
function updateHud(){ $('hptext').textContent=Math.max(0,Math.ceil(player.health));$('shtext').textContent=Math.max(0,Math.ceil(player.shield));$('hp').style.width=Math.max(0,player.health)+'%';$('sh').style.width=Math.max(0,player.shield*2)+'%';$('kills').textContent=player.kills;$('gems').textContent=player.gems}
function message(t){$('message').textContent=t}
function damagePlayer(n){if(player.shield>0){const d=Math.min(player.shield,n);player.shield-=d;n-=d}player.health=Math.max(0,player.health-n);if(player.health<=0){player.alive=false;finish(false)}updateHud()}
function finish(win){if(ended)return;ended=true;message(win?'VICTORY!\nAev Battle チャンピオン！':'GAME OVER\nもう一度挑戦しよう');setTimeout(()=>{const b=document.createElement('button');b.className='btn';b.textContent='もう一度プレイ';b.style.cssText='position:fixed;z-index:8;left:50%;top:60%;transform:translate(-50%,-50%);width:min(80%,300px)';b.onclick=()=>location.reload();document.body.appendChild(b)},300)}
function shoot(){if(!started||ended||!player.alive)return;const origin=playerRoot.position.clone();origin.y+=1.6;const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));raycaster.set(origin,dir);raycaster.far=55;const targets=enemies.filter(e=>e.alive).map(e=>({e,point:e.g.position.clone().add(new THREE.Vector3(0,1.1,0))}));let best=null,bestDist=55;for(const t of targets){const to=t.point.clone().sub(origin),along=to.dot(dir);if(along<0||along>bestDist)continue;const nearest=origin.clone().addScaledVector(dir,along);if(nearest.distanceTo(t.point)<1.15){best=t.e;bestDist=along}}if(best){best.hp-=34;const flash=new THREE.PointLight(0xff9b4a,3,3);flash.position.copy(best.g.position).add(new THREE.Vector3(0,1.5,0));scene.add(flash);setTimeout(()=>scene.remove(flash),65);if(best.hp<=0){best.alive=false;scene.remove(best.g);player.kills++;spawnGem(best.g.position.x,best.g.position.z);updateHud()}}}
function start(){if(started)return;started=true;$('start').style.display='none';playerRoot.position.copy(player.pos);yaw=0;message('');if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()}
$('play').addEventListener('click',start);
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')shoot()});
document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('pointerlockchange',()=>mouseLocked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(started&&mouseLocked){yaw-=e.movementX*.0025;pitch=Math.max(-.8,Math.min(.45,pitch-e.movementY*.002))}});
renderer.domElement.addEventListener('click',()=>{if(started&&!ended){if(matchMedia('(pointer:fine)').matches&&!mouseLocked)renderer.domElement.requestPointerLock?.();else shoot()}});
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});$('fire').addEventListener('pointerup',()=>fireHeld=false);$('fire').addEventListener('pointercancel',()=>fireHeld=false);
$('sprint').addEventListener('pointerdown',e=>{e.preventDefault();sprinting=true});$('sprint').addEventListener('pointerup',()=>sprinting=false);$('sprint').addEventListener('pointercancel',()=>sprinting=false);
const stick=$('stick'),nub=$('nub');let stickId=null;stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),max=37;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;nub.style.transform='translate('+dx+'px,'+dy+'px)'}function resetStick(){stickId=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
let lookPointer=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&started&&e.clientX>innerWidth*.42){lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookPointer){yaw-=(e.clientX-lastX)*.008;pitch=Math.max(-.8,Math.min(.45,pitch-(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null});
function blocked(x,z){if(Math.hypot(x,z)>54)return true;for(const o of obstacles){if(Math.abs(x-o.x)<o.rx&&Math.abs(z-o.z)<o.rz)return true}return false}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(started&&!ended){elapsed+=dt;zoneTimer+=dt;const forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;const side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;if(keys.ShiftLeft||keys.ShiftRight)sprinting=true;else if(!matchMedia('(pointer:coarse)').matches)sprinting=false;const speed=sprinting?10:6;const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt,dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*side)*speed*dt;const nx=playerRoot.position.x+dx,nz=playerRoot.position.z+dz;if(!blocked(nx,playerRoot.position.z))playerRoot.position.x=nx;if(!blocked(playerRoot.position.x,nz))playerRoot.position.z=nz;playerRoot.rotation.y=yaw;
 if(fireHeld&&Math.floor(elapsed*5)!==Math.floor((elapsed-dt)*5))shoot();
 for(const e of enemies){if(!e.alive)continue;const p=e.g.position,to=playerRoot.position.clone().sub(p);const dist=to.length();if(dist>3.8){to.normalize();const step=to.multiplyScalar((dist>20?2.6:1.5)*dt);const ex=p.x+step.x,ez=p.z+step.z;if(!blocked(ex,ez)){p.x=ex;p.z=ez}}e.g.rotation.y=Math.atan2(playerRoot.position.x-p.x,playerRoot.position.z-p.z);e.shot-=dt;if(dist<25&&e.shot<=0){e.shot=1.6+Math.random()*1.6;if(Math.random()<.55)damagePlayer(5+Math.random()*4)}}
 for(let i=gems.length-1;i>=0;i--){const g=gems[i];g.rotation.y+=dt*2.2;g.position.y=.8+Math.sin(elapsed*3+i)*.12;if(g.position.distanceTo(playerRoot.position.clone().add(new THREE.Vector3(0,.8,0)))<1.5){scene.remove(g);gems.splice(i,1);player.gems++;updateHud();if(player.gems>=10)finish(true)}}if(zoneTimer>18){zoneTimer=0;zoneRadius=Math.max(9,zoneRadius-5);ring.scale.setScalar(zoneRadius);$('zone').textContent='アリーナ縮小中'}ring.scale.setScalar(zoneRadius);if(Math.hypot(playerRoot.position.x,playerRoot.position.z)>zoneRadius){damagePlayer(4*dt);$('zone').textContent='危険！中央へ戻れ'}else if(zoneRadius<52)$('zone').textContent='💎 ジェムを10個集めよう';updateHud()}
 const target=playerRoot.position.clone().add(new THREE.Vector3(0,1.35,0));const distance=matchMedia('(pointer:coarse)').matches?15:13;const camOffset=new THREE.Vector3(0,distance,distance*.42);camera.position.lerp(target.clone().add(camOffset),.12);camera.lookAt(target.clone());renderer.render(scene,camera)}
ring.scale.setScalar(zoneRadius);updateHud();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script>
</body>
</html>
